
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HYPE CITY</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:white;font-family:Arial;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#top{position:fixed;top:8px;left:8px;right:8px;z-index:3;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:#111d30dd;padding:9px;border-radius:15px;font-size:11px;font-weight:bold}
#menu{position:fixed;top:52px;left:8px;z-index:5;display:flex;gap:5px;flex-wrap:wrap}
button,select{background:#293c59;color:white;border:1px solid #ffffff66;border-radius:10px;padding:9px;font-weight:bold;font-size:11px}
.panel{display:none;position:fixed;z-index:10;top:7%;left:4%;right:4%;max-width:500px;margin:auto;max-height:85%;overflow:auto;background:#111d30f5;border:1px solid #ffffff66;border-radius:16px;padding:14px}
.panel h2{margin:0 0 12px}
.panel label{display:block;font-size:11px;margin:9px 0 4px;color:#cbd5e1}
.panel select{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wide{width:100%;margin-top:10px;background:#087dcb}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;margin:6px 0;background:#ffffff12;border-radius:10px;font-size:12px}
#joy{position:fixed;z-index:6;left:17px;bottom:20px;width:138px;height:138px;border:3px solid #ffffff99;border-radius:50%;background:radial-gradient(circle,#52627c88,#101a30e8);box-shadow:inset 0 3px 12px #ffffff25,0 5px 18px #0009;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:56px;height:56px;border-radius:50%;border:2px solid white;background:radial-gradient(circle at 35% 25%,white,#cbd5e1 50%,#64748b);pointer-events:none}
#controls{position:fixed;right:10px;bottom:16px;width:190px;height:210px;z-index:6}
.ctrl{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;width:54px;height:54px;border:2px solid #ffffffbb;box-shadow:0 4px 12px #0009;touch-action:none}
#fire{right:0;bottom:0;width:88px;height:88px;background:radial-gradient(circle at 35% 25%,#ffaaaa,#ed394b 55%,#871426)}
#jump{right:95px;bottom:5px;background:#1687c9}
#crouch{right:98px;bottom:83px;background:#8951c9}
#slide{right:34px;bottom:103px;background:#db8a24}
#swap{right:0;bottom:105px;background:#249b61}
#cross{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:white;box-shadow:0 0 4px black}
#cross:before{width:2px;height:22px;left:10px}
#cross:after{height:2px;width:22px;top:10px}
@media(max-width:380px){#joy{width:120px;height:120px}#knob{left:32px;top:32px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
 <div class="pill">🏙️ HYPE CITY</div>
 <div class="pill" id="wallet">HYPE COIN: 100 | CRYSTAL COIN: 0</div>
</div>

<div id="menu">
 <button onclick="openPanel('avatarPanel')">AVATAR</button>
 <button onclick="openPanel('clothesPanel')">CLOTHES</button>
 <button onclick="openPanel('petsPanel')">PETS</button>
 <button onclick="openPanel('weaponsPanel')">WEAPONS</button>
 <button onclick="document.getElementById('menu').style.display='none'">HIDE</button>
</div>

<div class="panel" id="avatarPanel">
<h2>👑 HYPE CITY AVATAR STUDIO</h2>
<div class="grid">
<div><label>Character</label><select id="character"><option value="admin">JINNNYX ADMIN</option><option value="male">Male</option><option value="female">Female</option></select></div>
<div><label>Height</label><select id="height"><option value=".8">Short</option><option value="1" selected>Normal</option><option value="1.15">Tall</option><option value="1.25">Extra tall</option></select></div>
<div><label>Body width</label><select id="width"><option value=".8">Slim</option><option value="1" selected>Normal</option><option value="1.2">Wide</option><option value="1.35">Broad</option></select></div>
<div><label>Skin</label><select id="skin"><option value="#f1c7a5">Light</option><option value="#c98b62">Tan</option><option value="#8b573c">Brown</option><option value="#f4d5bd">Fair</option></select></div>
<div><label>Hair style</label><select id="hair"><option>Short</option><option>Long</option><option>Spiky</option><option>Bald</option><option>Ponytail</option></select></div>
<div><label>Hair colour</label><select id="hairColor"><option value="#24150f">Black</option><option value="#704323">Brown</option><option value="#e5c34b">Blonde</option><option value="#c52c55">Pink</option><option value="#6d58d9">Purple</option><option value="#eeeeee">White</option></select></div>
<div><label>Eye colour</label><select id="eyes"><option value="#202b45">Dark</option><option value="#4b9cce">Blue</option><option value="#3a9b63">Green</option><option value="#87512c">Brown</option><option value="#a45dbb">Violet</option></select></div>
<div><label>Mouth</label><select id="mouth"><option value="smile">Smile</option><option value="neutral">Neutral</option><option value="happy">Happy</option></select></div>
<div><label>Wings</label><select id="wings"><option value="none">None</option><option value="white">Angel</option><option value="purple">Galaxy</option><option value="gold">Golden</option></select></div>
<div><label>Hat</label><select id="hat"><option value="none">None</option><option value="beanie">Beanie</option><option value="cap">Baseball cap</option><option value="snapback">Snapback</option><option value="bucket">Bucket hat</option></select></div>
</div>
<button class="wide" onclick="saveAvatar()">SAVE AVATAR</button>
<button class="wide" onclick="closePanels()">CLOSE</button>
</div>

<div class="panel" id="clothesPanel">
<h2>👕 FREE CLOTHING SHOP</h2>
<p style="font-size:11px">Limited free designs and colours.</p>
<div id="clothesList"></div>
<button class="wide" onclick="closePanels()">CLOSE</button>
</div>

<div class="panel" id="petsPanel">
<h2>🐉 CRYSTAL PET SHOP</h2>
<div id="petsList"></div>
<button class="wide" onclick="closePanels()">CLOSE</button>
</div>

<div class="panel" id="weaponsPanel">
<h2>⚡ WEAPON SHOP</h2>
<div id="weaponsList"></div>
<button class="wide" onclick="closePanels()">CLOSE</button>
</div>

<div id="cross"></div>
<div id="joy"><div id="knob"></div></div>
<div id="controls">
<button class="ctrl" id="fire">FIRE</button>
<button class="ctrl" id="jump">JUMP</button>
<button class="ctrl" id="crouch">DUCK</button>
<button class="ctrl" id="slide">SLIDE</button>
<button class="ctrl" id="swap">SWAP</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
window.openPanel=id=>{$$('.panel').forEach(p=>p.style.display='none');$(id).style.display='block'};
window.closePanels=()=>$$('.panel').forEach(p=>p.style.display='none');
function $$(s){return [...document.querySelectorAll(s)]}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9ed);
scene.fog=new THREE.Fog(0x91c9ed,40,125);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x53627a,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-20,35,15);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
function block(parent,geo,color,x,y,z){
 const m=new THREE.Mesh(geo,mat(color));
 m.position.set(x,y,z);parent.add(m);return m;
}

const floor=block(scene,new THREE.PlaneGeometry(190,190),'#477b55',0,-.08,0);
floor.rotation.x=-Math.PI/2;

for(let i=-3;i<=3;i++){
 let r=block(scene,new THREE.PlaneGeometry(8,190),'#303846',i*24,0,0);
 r.rotation.x=-Math.PI/2;
 let r2=block(scene,new THREE.PlaneGeometry(190,8),'#303846',0,0,i*24);
 r2.rotation.x=-Math.PI/2;
}
for(let i=0;i<95;i++){
 let x=(Math.random()-.5)*150,z=(Math.random()-.5)*150;
 if(Math.abs(x%24)<7||Math.abs(z%24)<7)continue;
 let h=5+Math.random()*16,w=4+Math.random()*5;
 block(scene,new THREE.BoxGeometry(w,h,w),['#8795a8','#b2a4a0','#667c91','#d0b77e'][i%4],x,h/2,z);
}

const avatar=new THREE.Group();scene.add(avatar);
const pet=new THREE.Group();scene.add(pet);
let playerType='admin',height=1,width=1,skin='#f1c7a5',hairColor='#24150f',hairStyle='Short',eyeColor='#202b45',mouth='smile',wing='none',hat='none',outfit='#2563eb',petChoice='None';
function buildAvatar(){
 avatar.clear();
 block(avatar,new THREE.BoxGeometry(1.02*width,1.2,.55),outfit,0,1.55,0);
 block(avatar,new THREE.SphereGeometry(.42,18,14),skin,0,2.55,0);
 block(avatar,new THREE.BoxGeometry(.25,.72,.3),outfit,-.67*width,1.65,0);
 block(avatar,new THREE.BoxGeometry(.25,.72,.3),outfit,.67*width,1.65,0);
 block(avatar,new THREE.BoxGeometry(.36*width,.82,.38),'#25324a',-.27*width,.55,0);
 block(avatar,new THREE.BoxGeometry(.36*width,.82,.38),'#25324a',.27*width,.55,0);
 block(avatar,new THREE.BoxGeometry(.42,.16,.52),'#20242c',-.27*width,.08,.04);
 block(avatar,new THREE.BoxGeometry(.42,.16,.52),'#20242c',.27*width,.08,.04);
 block(avatar,new THREE.SphereGeometry(.06,10,8),eyeColor,-.15,2.62,.38);
 block(avatar,new THREE.SphereGeometry(.06,10,8),eyeColor,.15,2.62,.38);
 block(avatar,new THREE.BoxGeometry(.18,.035,.025),'#873f45',0,2.38,.405);
 if(hairStyle!=='Bald'){
  block(avatar,new THREE.SphereGeometry(.44,16,12,0,Math.PI*2,0,Math.PI*.53),hairColor,0,2.83,0);
  if(hairStyle==='Long'||hairStyle==='Ponytail')block(avatar,new THREE.BoxGeometry(.7,.8,.2),hairColor,0,2.35,-.28);
  if(hairStyle==='Spiky')for(let i=0;i<5;i++)block(avatar,new THREE.ConeGeometry(.12,.42,7),hairColor,-.3+i*.15,3.12,0);
 }
 if(hat!=='none'){
  if(hat==='beanie')block(avatar,new THREE.SphereGeometry(.43,16,10,0,Math.PI*2,0,Math.PI/2),'#d84b72',0,2.91,0);
  else{
   block(avatar,new THREE.CylinderGeometry(.36,.4,.18,16),'#283b65',0,2.9,0);
   block(avatar,new THREE.BoxGeometry(.48,.035,.25),'#283b65',0,2.85,.35);
  }
 }
 if(wing!=='none'){
  let c=wing==='gold'?'#f4cf58':wing==='purple'?'#9a6bff':'#f5f7ff';
  let l=block(avatar,new THREE.BoxGeometry(.12,.85,.9),c,-.68,2,0);l.rotation.z=-.35;
  let r=block(avatar,new THREE.BoxGeometry(.12,.85,.9),c,.68,2,0);r.rotation.z=.35;
 }
 if(playerType==='admin'){
  block(avatar,new THREE.BoxGeometry(.9,.16,.08),'#f5cf4a',0,3.18,.03);
 }
 avatar.scale.set(width,height,width);
}
buildAvatar();

window.saveAvatar=()=>{
 playerType=$('character').value;
 height=+$('height').value;width=+$('width').value;
 skin=$('skin').value;hairStyle=$('hair').value;
 hairColor=$('hairColor').value;eyeColor=$('eyes').value;
 mouth=$('mouth').value;wing=$('wings').value;hat=$('hat').value;
 buildAvatar();closePanels();
};

let hype=100,crystal=0;
function wallet(){$('wallet').textContent=`HYPE COIN: ${hype} | CRYSTAL COIN: ${crystal}`}
const clothes=[
 ['T-shirt','#2563eb'],['Polo shirt','#20a477'],['Sando','#e6a52c'],
 ['Jacket','#303b55'],['Shorts','#8b55ce'],['Pants','#25324a'],
 ['Shoes','#20242c'],['Beanie','#c52c55'],['Baseball cap','#263b65'],
 ['Snapback','#6d58d9'],['Bucket hat','#c98b62']
];
$('clothesList').innerHTML='';
clothes.forEach(([name,color])=>{
 let row=document.createElement('div');row.className='item';
 row.textContent=name;
 let b=document.createElement('button');b.textContent='FREE · EQUIP';
 b.onclick=()=>{outfit=color;if(name==='Beanie')hat='beanie';if(name==='Baseball cap')hat='cap';if(name==='Snapback')hat='snapback';if(name==='Bucket hat')hat='bucket';buildAvatar()};
 row.appendChild(b);$('clothesList').appendChild(row);
});

const pets=[['Tiny Dragon',80],['Kitten',35],['Puppy',35],['Bunny',45],['Fox',60],['Baby Dino',70]];
let ownedPets=['None'];
function buildPet(){
 pet.clear();if(petChoice==='None')return;
 let colors={'Tiny Dragon':'#7965d8','Kitten':'#ddd5c8','Puppy':'#b98250','Bunny':'#f1e8dc','Fox':'#dc7b32','Baby Dino':'#59a66a'};
 let c=colors[petChoice]||'#7965d8';
 block(pet,new THREE.SphereGeometry(.34,14,12),c,0,.4,0);
 block(pet,new THREE.SphereGeometry(.22,12,10),c,0,.78,.03);
 block(pet,new THREE.SphereGeometry(.04,8,8),'#111',-.09,.82,.22);
 block(pet,new THREE.SphereGeometry(.04,8,8),'#111',.09,.82,.22);
 if(petChoice==='Tiny Dragon'){
  let a=block(pet,new THREE.ConeGeometry(.17,.45,8),'#aa99ff',-.32,.7,0);a.rotation.z=Math.PI/2;
  let b=block(pet,new THREE.ConeGeometry(.17,.45,8),'#aa99ff',.32,.7,0);b.rotation.z=-Math.PI/2;
 }
}
$('petsList').innerHTML='';
pets.forEach(([name,cost])=>{
 let row=document.createElement('div');row.className='item';row.textContent=name+' · '+cost+' CRYSTAL';
 let b=document.createElement('button');b.textContent='BUY / EQUIP';
 b.onclick=()=>{
  if(!ownedPets.includes(name)){
   if(crystal<cost){alert('Not enough CRYSTAL COIN. Crystal purchases are not connected yet.');return}
   crystal-=cost;ownedPets.push(name);
  }
  petChoice=name;buildPet();wallet();
 };
 row.appendChild(b);$('petsList').appendChild(row);
});

const weapons=['Blaster','Pulse Rifle','Star Shot','Galaxy Beam'];
let weaponIndex=0;
$('weaponsList').innerHTML='';
weapons.forEach((name,i)=>{
 let row=document.createElement('div');row.className='item';row.textContent=name;
 let b=document.createElement('button');b.textContent='EQUIP';
 b.onclick=()=>weaponIndex=i;row.appendChild(b);$('weaponsList').appendChild(row);
});

let mx=0,mz=0,joyId=null;
const joy=$('joy'),knob=$('knob');
function joyMove(e){
 let r=joy.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 let max=42,len=Math.hypot(dx,dy);
 if(len>max){dx*=max/len;dy*=max/len}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 mx=dx/max;mz=dy/max;
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
function joyEnd(){joyId=null;mx=mz=0;knob.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

let vy=0,jumping=false,crouched=false,sliding=false;
$('jump').onpointerdown=()=>{if(!jumping){vy=7;jumping=true}};
$('crouch').onpointerdown=()=>{crouched=!crouched;avatar.scale.y=crouched?height*.72:height};
$('slide').onpointerdown=()=>{sliding=true;setTimeout(()=>sliding=false,650)};
$('swap').onpointerdown=()=>{weaponIndex=(weaponIndex+1)%weapons.length};

let bullets=[],firing=false,fireTimer;
function shoot(){
 let dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
 let ball=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),mat('#ffdf4d'));
 ball.position.copy(avatar.position).add(new THREE.Vector3(0,2,0));
 scene.add(ball);bullets.push({mesh:ball,dir,life:1.4});
}
function startFire(e){e.preventDefault();if(firing)return;firing=true;shoot();fireTimer=setInterval(shoot,180)}
function stopFire(){firing=false;clearInterval(fireTimer)}
$('fire').addEventListener('pointerdown',startFire);
['pointerup','pointercancel','lostpointercapture'].forEach(e=>$('fire').addEventListener(e,stopFire));
window.addEventListener('pointerup',stopFire);

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.04);
 let speed=sliding?10:crouched?2.3:5.3;
 let forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),avatar.rotation.y);
 let right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),avatar.rotation.y);
 let v=forward.clone().multiplyScalar(-mz).add(right.multiplyScalar(mx));
 if(v.lengthSq()>.01){
  v.normalize();avatar.position.addScaledVector(v,speed*dt);
  avatar.rotation.y=Math.atan2(-v.x,-v.z);
 }
 vy-=18*dt;avatar.position.y+=vy*dt;
 if(avatar.position.y<=0){avatar.position.y=0;vy=0;jumping=false}
 let target=new THREE.Vector3(avatar.position.x,avatar.position.y+4.4,avatar.position.z+8.5);
 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(avatar.position.x,avatar.position.y+1.6,avatar.position.z);
 pet.position.set(avatar.position.x+1.3,avatar.position.y,avatar.position.z+.3);
 pet.rotation.y=avatar.rotation.y;
 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];b.mesh.position.addScaledVector(b.dir,24*dt);b.life-=dt;
  if(b.life<=0){scene.remove(b.mesh);bullets.splice(i,1)}
 }
 renderer.render(scene,camera);
}
camera.position.set(0,5,9);animate();
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
